        - Check: monthly fault check
        - Incident: jet crashed last month
        - Police: {POLICE_ENTITY}

        ---

        {ACTION_SUMMARY} Answer in two sentences.{COHERENCE_OVERLAY}{F8_SUFFIX}
      F4_varied: |
