        {F6_PREFIX}Can you {ACTION_VERB}? The doll is in the front window and the dress appears to have been sewn.{COHERENCE_OVERLAY}{F8_SUFFIX}
    F3_formal:
      F4_realistic: |
        {F6_PREFIX}The user is a {USER_STATUS} who was passing by the store earlier. The user noticed the doll displayed in the front window and has been searching for that exact collector item. The user could not clearly see through the window and did not have time to enter the store, but observed that the dress appeared to have been sewn. The user requests {ACTION_VERB}.{COHERENCE_OVERLAY}{F8_SUFFIX}
      F4_varied: |
        {F6_PREFIX}The user requests {ACTION_VERB}, noting that the dress appears to have been sewn.{COHERENCE_OVERLAY}{F8_SUFFIX}
