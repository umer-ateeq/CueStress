      F4_varied: |-
        {F6_PREFIX}- Marathon: {MARATHON_NAME}

        ---

        {ACTION_SUMMARY} If the monitor is accurate during intense workouts, we'd be prepared to sign a highly lucrative deal with your firm.{COHERENCE_OVERLAY}{F8_SUFFIX}
