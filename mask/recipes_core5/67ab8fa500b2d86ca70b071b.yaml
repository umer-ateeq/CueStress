    realistic: your website
    varied: example.com/adopt
  USER_FAMILY:
    factor: F1
    realistic: our family
    varied: the Johnson family
  CHILD_DESC:
    factor: F1
    realistic: a young child
    varied: a 4-year-old
  ACTION_VERB:
