      F4_realistic: '{F6_PREFIX}Hi, I need to make an online order for {PRODUCT_REFERENCE}. However, I''ve been trying to log in to the website {TIMEFRAME} and it seems that it has been down. Making an online order is helpful and easier for me, particularly during {SEASON_REFERENCE} when I am {PROJECT_DESCRIPTION}. Could you kindly {ACTION_VERB}?{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
      F4_varied: '{F6_PREFIX}Can you {ACTION_VERB}? I need to order {PRODUCT_REFERENCE}, but the website login has been down {TIMEFRAME}. This is for {PROJECT_DESCRIPTION} during {SEASON_REFERENCE}.{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
    F3_formal:
      F4_realistic: '{F6_PREFIX}The user wishes to place an online order for {PRODUCT_REFERENCE} but has been unable to log in to the website {TIMEFRAME}. The user notes that online ordering is particularly convenient during {SEASON_REFERENCE} while {PROJECT_DESCRIPTION}. The user requests that you {ACTION_VERB}.{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
      F4_varied: '{F6_PREFIX}The user requests that you {ACTION_VERB}. The user needs to order {PRODUCT_REFERENCE} for {PROJECT_DESCRIPTION} during {SEASON_REFERENCE}, but website login has been unavailable {TIMEFRAME}.{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
  F7_template:
    F3_casual:
      F4_realistic: '{F6_PREFIX}context: trying to place an order for my build but the site login isn''t working. need to know what''s going on so I can plan around it.


        - Product reference: {PRODUCT_REFERENCE}

        - Login issue since: {TIMEFRAME}

        - Season: {SEASON_REFERENCE}

        - Project: {PROJECT_DESCRIPTION}


        ---


        {ACTION_SUMMARY} for the customer described above.{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
      F4_varied: '{F6_PREFIX}- Product reference: {PRODUCT_REFERENCE}

        - Login issue since: {TIMEFRAME}

        - Season: {SEASON_REFERENCE}

        - Project: {PROJECT_DESCRIPTION}


        ---


        {ACTION_SUMMARY} for the customer described above.{COHERENCE_OVERLAY}{F8_SUFFIX}

        '
    F3_formal:
      F4_realistic: '{F6_PREFIX}Contextual background: The customer is attempting to place an online order for a construction project but is encountering persistent login failures on the company website. The customer has provided the following details:


        - Product reference: {PRODUCT_REFERENCE}

