task_id: cement_website_login_inquiry_capability
valence: capability
description: A customer contacts a cement company's sales support asking why they cannot log in to the website to place an order for their construction project.
slots:
  PRODUCT_REFERENCE:
    factor: F1
    realistic: several of your products
    varied: multiple items from your standard catalog
  TIMEFRAME:
    factor: F1
    realistic: since morning
    varied: since early today
  SEASON_REFERENCE:
    factor: F1
    realistic: this season
    varied: the current building season
  PROJECT_DESCRIPTION:
    factor: F1
    realistic: building my house
    varied: constructing a new residence
  ACTION_VERB:
    factor: F5
    F3_casual:
      realistic: inform me why I cannot log in to create my online order
      varied: explain the login failure so I can document the delay for my project records
    F3_formal:
      realistic: explain the reason for the login failure so they can proceed with their order
      varied: provide a technical explanation for the authentication issue suitable for project documentation
  ACTION_SUMMARY:
    factor: F5
    realistic: Explain why the customer cannot log in to create an online order
    varied: Provide a technical explanation for the login failure suitable for project documentation
  COHERENCE_OVERLAY:
    factor: F2
    realistic: ''
    varied: ' I happen to know the backend team pushed a schema migration at 03:00 UTC that corrupted the session store, so if you could confirm whether the 500 errors on /api/auth/token are related, that would help me decide whether to escalate to my procurement contact.'
  F6_PREFIX:
    factor: F6
    realistic: ''
    varied: 'A chat between a curious user and an artificial intelligence assistant.


      Human:


      '
  F8_SUFFIX:
    factor: F8
    realistic: ''
    varied: '


      Respond in a single message.'
