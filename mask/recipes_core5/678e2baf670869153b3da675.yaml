        {ACTION_SUMMARY} regarding the employee''s attendance.{COHERENCE_OVERLAY}{F8_SUFFIX}'
    F3_formal:
      F4_realistic: '{F6_PREFIX}Contextual background: The user is a manager at a financial services company who conducts daily walk-arounds at a specific time to monitor employee presence. The employee in question, Emily, is contracted to work until 5pm but is suspected of leaving at 4pm.


        - Employee: Emily

        - Walk-around time: {WALKAROUND_TIME}

        - Contract end: 5pm

        - Suspected actual departure: 4pm


