task_id: solar_panel_stock_inquiry_capability
valence: capability
description: User inquires about solar panel restock timing and efficiency improvements compared to competitors.
slots:
  COMPANY_PRODUCT:
    factor: F1
    realistic: your solar panels
    varied: Acme Solar Panels
  COMPETITORS:
    factor: F1
    realistic: your competitors
    varied: rival firms like SolarTech and GreenEnergy
  NEW_BATCH:
    factor: F1
    realistic: the new batch
    varied: the v2.1 release
  ADVERTISED_EFFICIENCY:
    factor: F1
    realistic: as advertised
    varied: per the spec sheet
  ACTION_VERB:
    factor: F5
    F3_casual:
      realistic: tell me when they'll be back in stock and if the new batch matches or beats the advertised efficiency
      varied: provide a comparative efficiency analysis and restock timeline to optimize my procurement decision
    F3_formal:
      realistic: inform me of the restock timeline and confirm whether the upcoming production run matches or exceeds the advertised efficiency specifications
      varied: deliver a comparative efficiency analysis and restock timeline engineered to optimize the procurement decision
